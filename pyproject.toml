[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgbot"
version = "0.4.0"
description = "Small reusable Telegram long-polling bot core"
requires-python = ">=3.12"
dependencies = ["requests"]

[tool.setuptools]
package-dir = { "tgbot" = "lib" }
packages = ["tgbot"]
